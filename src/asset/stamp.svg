  <!-- Phone Circle -->
  <circle
      cx="400"
      cy="500"
      r="28"
      fill="none"
      stroke="#000"
      stroke-width="3"/>

  <!-- Phone Symbol -->
  <text
      x="400"
      y="510"
      text-anchor="middle"
      font-size="28">
      ☎
  </text>

  <!-- Phone Number -->
  <text
      x="400"
      y="570"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="34"
      font-weight="600">
      +251920839188
  </text>

</svg>