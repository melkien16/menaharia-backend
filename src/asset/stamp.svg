<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">

  <defs>
    <path id="topArc"
      d="M 140 400 A 260 260 0 0 1 660 400" />

    <path id="bottomArc"
      d="M 660 400 A 260 260 0 0 1 140 400" />
  </defs>

  <!-- Outer Rings -->
  <circle cx="400" cy="400" r="370"
          fill="none"
          stroke="#000"
          stroke-width="10"/>

  <circle cx="400" cy="400" r="350"
          fill="none"
          stroke="#000"
          stroke-width="3"/>

  <!-- Inner Circle -->
  <circle cx="400" cy="400" r="220"
          fill="none"
          stroke="#000"
          stroke-width="4"/>

  <!-- Top Text -->
  <text
      font-family="Arial, Helvetica, sans-serif"
      font-size="52"
      font-weight="700"
      letter-spacing="3">
    <textPath
        href="#topArc"
        startOffset="50%"
        text-anchor="middle">
      MENAHARIA PLC
    </textPath>
  </text>

  <!-- Bottom Text -->
  <text
      font-family="Arial, Helvetica, sans-serif"
      font-size="36"
      font-weight="700"
      letter-spacing="2">
    <textPath
        href="#bottomArc"
        startOffset="50%"
        text-anchor="middle">
      OFFICIAL TRANSPORT SERVICE
    </textPath>
  </text>

  <!-- Stars -->
  <text x="135" y="275"
        font-size="48"
        text-anchor="middle">★</text>

  <text x="665" y="275"
        font-size="48"
        text-anchor="middle">★</text>

  <text x="130" y="470"
        font-size="48"
        text-anchor="middle">★</text>

  <text x="670" y="470"
        font-size="48"
        text-anchor="middle">★</text>

  <!-- Side Dots -->
  <circle cx="120" cy="370" r="10"/>
  <circle cx="680" cy="370" r="10"/>

  <!-- Center Text -->
  <text
      x="400"
      y="360"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="45"
      font-weight="700">
      RECEIPT
  </text>

  <line
      x1="300"
      y1="385"
      x2="500"
      y2="385"
      stroke="#000"
      stroke-width="3"/>

  <text
      x="400"
      y="440"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="45"
      font-weight="700">
      VERIFIED
